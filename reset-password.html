<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Reset Password — Hotelzz.in</title>
  <link rel="icon" type="image/png" href="jpg.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #2563EB; --primary-dark: #1D4ED8; --bg: #F8FAFC; --text: #0F172A;
      --text-muted: #64748B; --border: #E2E8F0; --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #EFF6FF 0%, #F8FAFC 50%, #ECFDF5 100%);
      color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
    }
    .auth-header {
      height: 70px; background: #FFF; border-bottom: 1px solid var(--border);
      padding: 0 32px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand-logo { font-weight: 800; font-size: 22px; color: var(--primary); text-decoration: none; }
    .brand-logo span { color: var(--text); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .card {
      width: 100%; max-width: 420px; background: #FFF; border: 1px solid var(--border);
      border-radius: var(--radius); padding: 30px; box-shadow: 0 10px 25px rgba(15,23,42,.08);
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 700; font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px; }
    .form-control {
      width: 100%; padding: 11px 13px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 14px; font-family: inherit; outline: none;
    }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .btn {
      width: 100%; padding: 12px; background: var(--primary); color: #FFF; border: none;
      border-radius: 8px; font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn[disabled] { opacity: .6; cursor: not-allowed; }
    .alert {
      padding: 11px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
      margin-bottom: 16px; line-height: 1.5;
      background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA;
    }
    .alert.success { background: #ECFDF5; color: #047857; border-color: #A7F3D0; }
    .foot { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-muted); }
    .foot a { color: var(--primary); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <header class="auth-header">
    <a href="index.html" class="brand-logo">Hotelzz<span>.in</span></a>
    <a href="login.html" style="font-size:13.5px;font-weight:600;color:var(--text-muted);text-decoration:none;">← Back to Sign In</a>
  </header>

  <main>
    <div class="card">
      <h1>Set a new password</h1>
      <p class="sub" id="subLine">Choose a password of at least 8 characters.</p>

      <div id="alertBox" class="alert" style="display:none;"></div>

      <form id="resetForm">
        <div class="form-group">
          <label>New Password</label>
          <input type="password" name="password" class="form-control" minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters" required />
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" name="confirm" class="form-control" minlength="8" autocomplete="new-password" placeholder="Repeat the password" required />
        </div>
        <button type="submit" class="btn">Update password →</button>
      </form>

      <div class="foot">Remembered it? <a href="login.html">Sign in instead</a></div>
    </div>
  </main>

  <script src="api-client.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token') || '';
    var email = params.get('email') || '';
    var role = params.get('role') || 'traveler';
    var form = document.getElementById('resetForm');

    function alertBox(msg, type) {
      var el = document.getElementById('alertBox');
      el.textContent = msg;
      el.className = 'alert ' + (type || 'error');
      el.style.display = 'block';
    }

    if (!token || !email) {
      alertBox('This reset link is incomplete. Request a new one from the sign-in page.');
      form.style.display = 'none';
    } else {
      document.getElementById('subLine').textContent = 'Resetting the password for ' + email + '.';
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var data = {};
      new FormData(form).forEach(function (v, k) { data[k] = String(v); });
      if (data.password !== data.confirm) return alertBox('The two passwords do not match.');

      var btn = form.querySelector('button');
      btn.disabled = true;
      var label = btn.textContent;
      btn.textContent = 'Please wait…';

      window.HotelzzAPI.auth.resetPassword({ email: email, token: token, password: data.password })
        .then(function (r) {
          alertBox(r.message + ' Redirecting…', 'success');
          form.style.display = 'none';
          setTimeout(function () { window.location.href = r.redirect || ('login.html?type=' + role); }, 1500);
        })
        .catch(function (err) {
          alertBox(err.message);
          btn.disabled = false;
          btn.textContent = label;
        });
    });
  </script>
</body>
</html>
