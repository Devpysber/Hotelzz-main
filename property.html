        <div class="pdp-layout">\
          <div class="pdp-main">\

            </section>\
            <section>\
              <h2>Guest reviews</h2>\
              <div id="realReviewsSummary" style="font-size:13.5px;color:var(--text-muted);margin-bottom:14px;">Loading reviews…</div>\
              <div id="realReviewsList"></div>\
            </section>\
            ' + (hotel.google_cid ? '<section>\
              <h2>View on Google</h2>\
              <div class="greviews-head">\
                <div class="greviews-score">' + hotel.rating.toFixed(1) + '<small>/5</small></div>\
                <div class="glogo-big">\
                  <span class="gB">G</span><span class="go1">o</span><span class="go2">o</span><span class="gg">g</span><span class="gl">l</span><span class="ge">e</span><br>\
                  <a href="https://www.google.com/maps?cid=' + hotel.google_cid + '" target="_blank" rel="noopener">' + (hotel.google_review_count ? 'View ' + hotel.google_review_count + ' ratings →' : 'View on Google Maps →') + '</a>\
                </div>\
              </div>\
              ' + (hotel.google_summary ? '<div class="ai-summary">\
                <div class="ai-tag">✦ AI generated summary</div>\
                <p>' + esc(hotel.google_summary) + '</p>\
              </div>' : '') + '\
              <iframe class="gmap-embed" loading="lazy" src="https://www.google.com/maps?cid=' + hotel.google_cid + '&output=embed" allowfullscreen></iframe>\
            </section>' : '') + '\
            <section>\
              <h2>Property highlights</h2>\
              <div class="info-grid">\
                <div class="info-block"><strong>Location</strong><span>' + esc(hotel.location) + '</span></div>\
                <div class="info-block"><strong>Pincode</strong><span>' + esc(hotel.pincode || '—') + '</span></div>\
                <div class="info-block"><strong>Property type</strong><span>' + esc(hotel.property_type || 'Verified Stay') + '</span></div>\
                <div class="info-block"><strong>Guest rating</strong><span>★ ' + hotel.rating.toFixed(1) + ' / 5</span></div>\
              </div>\
            </section>\
            <section>\
              <h2>Booking policies</h2>\
              <ul class="policy-list">\
                <li><span>Check-in</span><span>2:00 PM onwards</span></li>\
                <li><span>Check-out</span><span>11:00 AM</span></li>\
                <li><span>Cancellation</span><span>Free cancellation up to 48hrs before check-in</span></li>\
                <li><span>Payment</span><span>Pay 25% to confirm · balance at check-in</span></li>\
                <li><span>ID required</span><span>Valid government photo ID for all guests</span></li>\
                <li><span>Children</span><span>Allowed · contact host for extra bedding</span></li>\
              </ul>\
            </section>\
            <section>\
              <h2>Why book direct on Hotelzz.in</h2>\
              <ul class="amenity-grid" style="list-style:none;">\
                <li class="amenity-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>No platform booking fees</li>\
                <li class="amenity-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Direct WhatsApp with property</li>\
                <li class="amenity-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Best rate guaranteed</li>\
                <li class="amenity-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Verified properties only</li>\
                <li class="amenity-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Instant booking confirmation</li>\
                <li class="amenity-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Local Goa support team</li>\
              </ul>\
            </section>\
          </div>\
          <aside>\
            <div class="booking-card" id="bookingForm">\
              <div class="price-block">' + priceHtml + '</div>\
              <div class="price-tax">' + (hotel.min_price ? 'per night + taxes & fees' : 'Confirm the rate directly with the host') + '</div>\
              <a href="https://wa.me/919930090487?text=' + encodeURIComponent("Hi Hotelzz! I want the best rate for " + hotel.name + " in " + hotel.location + ". Please share availability and your best price.") + '&utm_source=website&utm_medium=property_page&utm_campaign=best_rate" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;gap:8px;background:var(--whatsapp);color:#fff;padding:13px;border-radius:10px;font-weight:700;font-size:15px;text-decoration:none;margin:14px 0;box-shadow:0 6px 16px rgba(37,211,102,0.25);transition:all 0.2s;" onmouseover="this.style.background=\'#1DA851\'" onmouseout="this.style.background=\'#25D366\'">\
                <svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24z"/></svg>\
                Best Rate on WhatsApp →\
              </a>\
              <div style="text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:16px;">— or fill the form below —</div>\
              <form id="bookForm" onsubmit="return submitBooking(event)" novalidate>\
                <div class="form-row">\
                  <div class="form-field"><label>Check-in</label><input type="date" id="fCheckIn" required></div>\
                  <div class="form-field"><label>Check-out</label><input type="date" id="fCheckOut" required></div>\
                </div>\
                <div class="form-row">\
                  <div class="form-field"><label>Guests</label><select id="fGuests"><option>1 Guest</option><option selected>2 Guests</option><option>3 Guests</option><option>4 Guests</option><option>5 Guests</option><option>6+ Guests</option></select></div>\
                  <div class="form-field"><label>Rooms</label><select id="fRooms"><option selected>1 Room</option><option>2 Rooms</option><option>3 Rooms</option><option>4+ Rooms</option></select></div>\
                </div>\
                <div class="form-row">\
                  <div class="form-field form-field-full"><label>Your full name *</label><input type="text" id="fName" required placeholder="e.g. Rohit Sharma"></div>\
                </div>\
                <div class="form-row">\
                  <div class="form-field form-field-full"><label>WhatsApp / Phone *</label><input type="tel" id="fPhone" required pattern="[0-9 +-]{10,15}" placeholder="e.g. +91 98765 43210"></div>\
                </div>\
                <div class="form-row">\
                  <div class="form-field form-field-full"><label>Email (optional)</label><input type="email" id="fEmail" placeholder="you@example.com"></div>\
                </div>\
                <div class="form-row">\
                  <div class="form-field form-field-full"><label>Anything special? (optional)</label><textarea id="fNotes" placeholder="Early check-in, airport pickup, dietary needs, occasion..."></textarea></div>\
                </div>\
                <div class="form-error" id="formError"></div>\
                <button type="submit" class="submit-wa">\
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24z"/></svg>\
                  Book on WhatsApp\
                </button>\
                <a href="tel:+919930090487" class="secondary-call">📞 Or call +91 99300 90487</a>\
              </form>\
              <ul class="trust-points">\
                <li>Free cancellation till 48hrs before check-in</li>\
                <li>Best price guaranteed · No hidden fees</li>\
                <li>Verified property · Instant confirmation</li>\
                <li>We respond on WhatsApp within 5 minutes</li>\
              </ul>\
            </div>\
          </aside>\
        </div>\
      </div>';

    loadRealReviews();

    document.getElementById('mbPrice').textContent = hotel.min_price ? '₹' + Math.round(hotel.min_price).toLocaleString('en-IN') : 'On request';

    // Default dates: today + 1, today + 2
    var today = new Date(); var d1 = new Date(today); d1.setDate(d1.getDate()+1);
    var d2 = new Date(today); d2.setDate(d2.getDate()+2);
    function fmt(d){ return d.toISOString().slice(0,10); }
    document.getElementById('fCheckIn').value = fmt(d1);
    document.getElementById('fCheckIn').min = fmt(today);
    document.getElementById('fCheckOut').value = fmt(d2);
    document.getElementById('fCheckOut').min = fmt(d1);

    document.getElementById('fCheckIn').addEventListener('change', function(){
      var ci = new Date(this.value); var co = new Date(ci); co.setDate(co.getDate()+1);
      var coEl = document.getElementById('fCheckOut'); coEl.min = fmt(co);
      if (new Date(coEl.value) <= ci) coEl.value = fmt(co);
    });
  }

  // Real traveler reviews for this property — replaces any fabricated rating
  // data with what actually exists in the database.
  function loadRealReviews() {
    var summaryEl = document.getElementById('realReviewsSummary');
    var listEl = document.getElementById('realReviewsList');
    if (!summaryEl || !listEl || !window.HotelzzAPI || !hotel) return;

    window.HotelzzAPI.get('/reviews?propertyId=' + encodeURIComponent(hotel.id)).then(function (r) {
      var reviews = r.reviews || [];
      if (!reviews.length) {
        summaryEl.textContent = 'No guest reviews yet — be the first to stay and share one.';
        listEl.innerHTML = '';
        return;
      }
      summaryEl.innerHTML = '<strong>' + (r.average || '—') + '</strong>/5 average · ' + r.count + ' review' + (r.count === 1 ? '' : 's') + ' from verified stays';
      listEl.innerHTML = reviews.map(function (rev) {
        var date = rev.date ? new Date(rev.date.replace(' ', 'T')).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
        return '<div style="border-top:1px solid var(--border);padding:14px 0;">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">' +
          '<strong>' + esc(rev.userName || 'Guest') + '</strong>' +
          '<span style="font-weight:700;color:#D97706;">★ ' + rev.rating + '/5</span>' +
          '</div>' +
          (rev.comment ? '<p style="font-size:13.5px;color:var(--text);margin-bottom:6px;">' + esc(rev.comment) + '</p>' : '') +
          '<div style="font-size:11.5px;color:var(--text-muted);">' + esc(date) + '</div>' +
          (rev.ownerReply ? '<div style="margin-top:8px;background:var(--bg-alt);border-radius:8px;padding:10px 12px;font-size:13px;"><strong>Host response:</strong> ' + esc(rev.ownerReply) + '</div>' : '') +
          '</div>';
      }).join('');
    }).catch(function () {
      summaryEl.textContent = '';
      listEl.innerHTML = '';
    });
  }

  // Counts a listing view / contact click for the owner's dashboard stats.
  function track(event) {
    if (!hotel || !hotel.id) return;
    fetch('/api/properties/' + encodeURIComponent(hotel.id) + '/track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ event: event })
    }).catch(function () {});
  }

  // Record the listing view, and contact clicks, for the owner's stats.
  if (hotel && hotel.id) {
    track('view');
    document.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a') : null;
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (href.indexOf('tel:') === 0) track('phone');
      else if (href.indexOf('wa.me') !== -1) track('whatsapp');
      else if (hotel.website && href.indexOf(hotel.website) === 0) track('website');
      else if (href.indexOf('google.com/maps') !== -1) track('directions');
    });
  }

  function submitBooking(ev) {
    ev.preventDefault();
    var name = document.getElementById('fName').value.trim();
    var phone = document.getElementById('fPhone').value.trim();
    var checkIn = document.getElementById('fCheckIn').value;
    var checkOut = document.getElementById('fCheckOut').value;
    var guests = document.getElementById('fGuests').value;
    var rooms = document.getElementById('fRooms').value;
    var email = document.getElementById('fEmail').value.trim();
    var notes = document.getElementById('fNotes').value.trim();
    var err = document.getElementById('formError');

    if (!name || name.length < 2) { err.textContent = 'Please enter your full name.'; err.classList.add('show'); return false; }
    if (!phone || phone.replace(/[^0-9]/g,'').length < 10) { err.textContent = 'Please enter a valid 10-digit phone number.'; err.classList.add('show'); return false; }
    if (!checkIn || !checkOut) { err.textContent = 'Please pick check-in and check-out dates.'; err.classList.add('show'); return false; }
    if (new Date(checkOut) <= new Date(checkIn)) { err.textContent = 'Check-out must be after check-in.'; err.classList.add('show'); return false; }
    err.classList.remove('show');

    var msg = "🏨 *New Booking Enquiry — Hotelzz.in*\n\n" +
      "*Property:* " + hotel.name + "\n" +
      "*Location:* " + hotel.location + "\n" +
      "*Property ID:* " + hotel.id + "\n\n" +
      "*Guest Name:* " + name + "\n" +
      "*Phone / WhatsApp:* " + phone + "\n" +
      (email ? "*Email:* " + email + "\n" : "") +
      "\n*Check-in:* " + checkIn + "\n" +
      "*Check-out:* " + checkOut + "\n" +
      "*Guests:* " + guests + "\n" +
      "*Rooms:* " + rooms + "\n" +
      (notes ? "\n*Special requests:* " + notes + "\n" : "") +
      "\nPlease confirm availability & best rate. Thanks!";

    var btn = ev.target && ev.target.querySelector ? ev.target.querySelector('button[type=submit]') : null;
    var btnLabel = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Sending enquiry...'; }

    // The enquiry is stored on the server, which emails the hotel, the guest
    // and the Hotelzz team. WhatsApp opens as a second, optional channel.
    window.HotelzzEnquiryStore.sendEnquiry({
      name: name,
      email: email,
      phone: phone,
      propertyId: hotel.id,
      propertyName: hotel.name,
      propertyCity: hotel.location || '',
      checkIn: checkIn,
      checkOut: checkOut,
      guests: parseInt(guests, 10) || 2,
      message: notes || ('Booking enquiry for ' + rooms + ' room(s), ' + guests + ' guest(s).'),
      source: 'property_form'
    }).then(function (enq) {
      if (btn) { btn.disabled = false; btn.textContent = btnLabel; }
      showEnquirySuccess(enq);
      var url = 'https://wa.me/919930090487?text=' + encodeURIComponent(msg) + '&utm_source=website&utm_medium=property_form&utm_campaign=booking';
      window.open(url, '_blank');
    }).catch(function (error) {
      if (btn) { btn.disabled = false; btn.textContent = btnLabel; }
      err.textContent = error.message || 'Could not send the enquiry. Please try again.';
      err.classList.add('show');
    });

    return false;
  }

  function showEnquirySuccess(enq) {
    var err = document.getElementById('formError');
    err.classList.remove('show');
    var form = document.getElementById('bookingForm');
    var box = document.createElement('div');
    box.className = 'enquiry-success';
    box.style.cssText = 'background:#ECFDF5;border:1px solid #A7F3D0;color:#047857;padding:16px;border-radius:10px;font-size:14px;line-height:1.6;';
    box.innerHTML = '<strong>Enquiry sent to ' + esc(hotel.name) + '.</strong><br/>' +
      'Reference <strong>' + esc(enq.id) + '</strong>. The hotel replies to you directly — we emailed you a copy. ' +
      '<a href="user-portal.html#enquiries" style="color:#047857;font-weight:700;">Track it in your portal →</a>';
    if (form) { form.style.display = 'none'; form.parentNode.insertBefore(box, form); }
  }
</script>
